name: Import NSMB WebGL archive versions

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  import-archives:
    if: github.actor == 'owenfun07'
    runs-on: ubuntu-latest

    steps:
      - name: Check out your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and extract upstream WebGL versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for version in v2.2.0.1 v2.1.1.0 v2.1.0.1 v1.7.1.0-beta; do
            echo "Importing $version..."

            rm -rf "$version" /tmp/nsmb-release
            mkdir -p "$version" /tmp/nsmb-release

            gh release download "$version"               --repo ipodtouch0218/NSMB-MarioVsLuigi               --pattern "MarioVsLuigi-WebGL-$version.zip"               --dir /tmp/nsmb-release

            unzip -q "/tmp/nsmb-release/MarioVsLuigi-WebGL-$version.zip" -d "$version"

            # Normalize an archive that may contain one wrapper directory.
            if [ ! -f "$version/index.html" ]; then
              inner_dir="$(find "$version" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
              if [ -n "$inner_dir" ] && [ -f "$inner_dir/index.html" ]; then
                shopt -s dotglob
                mv "$inner_dir"/* "$version"/
                rmdir "$inner_dir"
              fi
            fi

            test -f "$version/index.html"
            test -f "$version/Build/MarioVsLuigi-WebGL.loader.js"
            test -f "$version/Build/MarioVsLuigi-WebGL.data.unityweb"
            test -f "$version/Build/MarioVsLuigi-WebGL.wasm.unityweb"

            echo "$version imported successfully."
          done

      - name: Commit the imported versions and remove this temporary workflow
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v2.2.0.1 v2.1.1.0 v2.1.0.1 v1.7.1.0-beta .github/workflows/import-nsmb-archives.yml
          git rm .github/workflows/import-nsmb-archives.yml

          git commit -m "Add NSMB WebGL archive versions"
          git push
