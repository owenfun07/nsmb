<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open newest version in about:blank | Owen.fun</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101114;color:#f5f5f7}
body{min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(620px,100%);padding:28px;border:1px solid #34353e;border-radius:16px;background:#191a20;box-shadow:0 20px 70px #0008}
h1{margin:0 0 10px;font-size:clamp(23px,5vw,32px)}p{color:#c6c7d0;line-height:1.55}
#target{color:#fff;font-weight:650}button{margin-top:12px;width:100%;padding:14px 18px;border:0;border-radius:9px;background:#e7353e;color:#fff;font-size:16px;font-weight:750;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.note{font-size:12px;color:#999ba8}
</style>
</head>
<body>
<main>
<h1 id="heading">Opening in a new tab…</h1>
<p id="description">Preparing the newest game version in an <code>about:blank</code> tab.</p>
<p>Destination: <span id="target">Newest regular version</span></p>
<button id="open" type="button">Open in about:blank</button>
<p class="note">Browsers may block tabs opened automatically. If nothing opens, use the button. This page is separate from the main game menu.</p>
</main>
<script>
(() => {
  const root = "/nsmb/";
  // Update this single version value when the regular launcher gets a newer release.
  const newestVersion = "v2.2.0.1";
  const destination = root + "?ab=regular";
  const label = "Newest Regular Version (" + newestVersion + ")";
  document.title = "Open " + label + " in about:blank";
  document.getElementById("heading").textContent = "Open newest game version in about:blank";
  document.getElementById("description").textContent = "A new tab will display the newest regular version inside a full-window frame. The original page will stay separate.";
  document.getElementById("target").textContent = label;

  function openBlank() {
    const tab = window.open("about:blank", "_blank");
    if (!tab) {
      document.getElementById("heading").textContent = "Your browser blocked the new tab";
      document.getElementById("description").textContent = "Click the button again or allow pop-ups for this site. The game has not been opened yet.";
      return;
    }
    const safeUrl = new URL(destination, location.origin).href;
    const safeTitle = label.replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch]));
    tab.document.open();
    tab.document.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + safeTitle + '</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;border:0;width:100%;height:100%;background:#000}</style></head><body><iframe allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" src="' + safeUrl.replace(/&/g,"&amp;").replace(/"/g,"&quot;") + '"></iframe></body></html>');
    tab.document.close();
    document.getElementById("heading").textContent = "Opened in a new tab";
    document.getElementById("description").textContent = "If the tab did not appear, check whether your browser blocked pop-ups.";
  }
  document.getElementById("open").addEventListener("click", openBlank);
  window.addEventListener("load", () => setTimeout(openBlank, 120));
})();
</script>
</body>
</html>
